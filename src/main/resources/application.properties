spring.application.name=Grupo2

# Solo desarrollo local: API SIN autenticacion/autorizacion. No publicar.
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://localhost:5432/BDTrueForm
spring.datasource.username=postgres
spring.datasource.password=Alvaro105

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
# DEBUG << INFO << WARN << ERROR
logging.level.com.trueform.backend=DEBUG
logging.file.name=logs/api.log
# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent

# Configuración de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=1200000